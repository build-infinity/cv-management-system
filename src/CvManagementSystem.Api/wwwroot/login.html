<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light">
  <title>Sign in</title>
  <link rel="stylesheet" href="/css/login.css">
  <script src="/js/login.js" defer></script>
</head>
<body>
  <main class="auth-card" aria-labelledby="auth-title">
    <header class="auth-header">
      <div class="auth-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="7" y="4" width="18" height="24" rx="4" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="16" cy="12" r="3" fill="currentColor" opacity=".85"/>
          <path d="M12 19h8m-8 4h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="icon-spark"></span>
      </div>
      <h1 id="auth-title">Sign in</h1>
      <p id="auth-subtitle" class="subtitle">Sign in to your account.</p>
    </header>
    <noscript><p class="feedback">Enable JavaScript in your browser to continue.</p></noscript>
    <div id="feedback" class="feedback" role="alert" hidden></div>
    <div id="auth-controls">
      <form id="auth-form">
        <div id="name-fields" class="name-fields" hidden>
          <div class="field">
            <label for="first-name">First name</label>
            <input id="first-name" name="firstName" autocomplete="given-name" maxlength="100" disabled>
          </div>
          <div class="field">
            <label for="last-name">Last name</label>
            <input id="last-name" name="lastName" autocomplete="family-name" maxlength="100" disabled>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
            <button id="toggle-password" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p id="password-hint" class="hint" hidden>At least 8 characters.</p>
        </div>
        <button id="submit-auth" class="primary-button" type="submit">Sign in</button>
      </form>
      <div class="divider">or</div>
      <a id="google-login" class="google-button" href="/api/auth/google?returnToLogin=true">
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.89-1.74 2.98-4.3 2.98-7.36Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.04.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.41 13.92a6 6 0 0 1 0-3.84V7.49H3.07a10 10 0 0 0 0 9.02l3.34-2.59Z"/>
          <path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.82 1.51l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.93 5.49l3.34 2.59C7.2 7.72 9.4 5.96 12 5.96Z"/>
        </svg>
        Continue with Google
      </a>
      <p class="mode-switch"><span id="mode-prompt">New here?</span> <a id="switch-mode" href="/login.html?mode=signup">Sign up</a></p>
      <button id="resend-email" class="text-button resend" type="button">Resend verification email</button>
    </div>
    <div id="success-panel" hidden tabindex="-1">
      <button id="switch-account" class="secondary-button" type="button">Sign out</button>
    </div>
  </main>
</body>
</html>
